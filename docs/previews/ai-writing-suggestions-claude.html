<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>推荐情节局部样式预览</title><style>/* ============================================================
   _tokens — Design tokens (CSS custom properties)
   Theme: 奶茶 · 奶油 — warm cream ground, espresso ink, milk-tea brand
   ============================================================ */

:root {
  color-scheme: light;

  /* Light theme — clean white, warm neutrals, milk-tea brown */
  --bg-primary: #ffffff;
  --bg-secondary: #f6f4f1;
  --bg-card: #ffffff;
  --bg-hover: #f5f2ee;
  --text-primary: #211e1a;
  --text-secondary: #5b554e;
  --text-muted: #736d65; /* 弱化文字 — AA 对比度 ≥4.5:1（白底 5.11 / 奶油底 4.66） */
  --accent: #8b6045;
  --accent-hover: #74503a;
  --accent-light: #f0e6d6;
  --accent-subtle: #f8f3ec;
  --accent-ink: var(--accent-ink-light, #ffffff);
  --border: #ece8e2;
  --border-light: #f3f0eb;
  /* 全站单行输入框：白色纸面、细暖灰边框、无静态阴影。随主题继承。 */
  --input-background: var(--bg-card);
  --input-border: var(--border);
  --input-radius: var(--radius-lg);
  --input-focus-border: var(--accent);
  --input-focus-shadow: 0 0 0 2px var(--focus-ring);
  --focus-ring: rgba(139, 96, 69, 0.24);
  --selection-bg: rgba(212, 184, 150, 0.5);
  --overlay-bg: rgba(33, 30, 26, 0.45);
  --color-success: #4f7a52;
  --color-warning: #b07c2f;
  --color-danger: #be123c;
  --color-info: #8b6045;
  --color-seal: #b8453a; /* "已收录" collector's seal — vermilion stamp */
  --color-seal-ink: #fce8e4; /* 印章上的文字：与朱砂底 4.51:1，恰好过 AA */
  --shadow: 0 1px 2px rgba(40, 32, 24, 0.04), 0 1px 3px rgba(40, 32, 24, 0.05);
  --shadow-md: 0 6px 16px rgba(40, 32, 24, 0.08);
  --shadow-lg: 0 16px 40px rgba(40, 32, 24, 0.12);
  --shadow-popover: 0 8px 28px rgba(40, 32, 24, 0.12);
  --radius: 8px;
  --radius-sm: 6px;
  --radius-lg: 12px;
  --radius-full: 9999px;
  --radius-md: 10px; /* compact controls / cards */
  --radius-xl: 16px; /* nested surfaces / dialogs */
  --radius-2xl: 20px; /* large surfaces / panels */

  /* Compact identity primitives shared by lists and account controls. */
  --avatar-size: 2.25rem; /* 36px */
  --avatar-font-size: 0.8125rem;
  --badge-label-size: 0.6875rem; /* 11px */
  --badge-padding-block: 0.1875rem;
  --badge-padding-inline: 0.5rem;
  --panel-count-label-size: 0.75rem;
  --admin-search-width: 17.5rem;

  /* Shared dropdown menus — spacious paper surface, portal-safe across themes. */
  --menu-min-width: 11rem;
  --menu-padding: 0.25rem;
  --menu-radius: var(--radius-lg);
  --menu-item-height: 2.25rem;
  --menu-item-padding-inline: 0.75rem;
  --menu-item-radius: var(--radius-sm);
  --menu-item-font-size: 0.8125rem;
  --menu-separator-margin: 0.25rem;
  --menu-shadow: var(--shadow-popover);

  /* Segmented Tabs — shared track/active-surface geometry and motion.
     Surface and foreground tokens may be overridden by the consuming surface;
     the geometry and transition stay consistent across themes and pages. */
  --tabs-segmented-inset: 0.1875rem; /* 3px */
  --tabs-segmented-gap: var(--tabs-segmented-inset);
  --tabs-segmented-radius: var(--radius-lg); /* 12px track */
  --tabs-segmented-inner-radius: calc(var(--tabs-segmented-radius) - var(--tabs-segmented-inset)); /* 9px active surface */
  --tabs-segmented-track-background: var(--bg-secondary);
  --tabs-segmented-track-border: var(--border);
  --tabs-segmented-active-background: var(--bg-card);
  --tabs-segmented-active-shadow: var(--shadow);
  --tabs-segmented-muted-foreground: var(--text-muted);
  --tabs-segmented-active-foreground: var(--accent-hover);
  --tabs-segmented-label-size: 0.8125rem; /* 13px */
  --tabs-segmented-label-weight: 500;
  --tabs-segmented-active-label-weight: 600;
  --tabs-segmented-label-line-height: 1.6;

  /* Segmented tabs motion. */
  --tabs-segmented-duration: 180ms;
  --tabs-segmented-ease: var(--ease-out);
  --tabs-segmented-transition: var(--tabs-segmented-duration) var(--tabs-segmented-ease);

  /* Shared modal elevation. */
  --shadow-modal: 0 24px 70px rgba(40, 32, 24, 0.18);

  /* Typography — system sans UI, serif reserved for reading */
  --font-heading: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  --font-serif:
    'Noto Serif SC', 'Noto Serif CJK SC', 'Source Han Serif SC', 'Source Han Serif CN', 'Songti SC', 'STSongti-SC-Regular', 'STSongti SC', 'Songti TC',
    'Hiragino Mincho ProN', 'Hiragino Mincho Pro', 'STSong', 'SimSun', ui-serif, serif;
  --font-mono: 'SF Mono', 'Fira Code', 'Consolas', monospace;

  /* Sizing */
  --max-width-reader: 680px;
  --max-width-content: 1200px;
  --header-height: 64px;

  /* Transition */
  --ease: cubic-bezier(0.4, 0, 0.2, 1);
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
}

/* Dark theme — moonlit paper */
[data-theme='dark'] {
  color-scheme: dark;
  --bg-primary: #1b1c20;
  --bg-secondary: #24252a;
  --bg-card: #2a2b31;
  --bg-hover: #34353c;
  --text-primary: #e7e0d6;
  --text-secondary: #aea597;
  --text-muted: #a79e92; /* 暗色弱化文字 — 提亮至 AA 对比度 ≥4.5:1（卡片底 5.38:1） */
  --accent: #bf8f52;
  --accent-hover: #d0a064;
  --accent-light: #3d2f20;
  --accent-subtle: #2c261e;
  --accent-ink: var(--accent-ink-dark, #1d1510);
  --border: #3b3c43;
  --border-light: #33343a;
  --focus-ring: rgba(191, 143, 82, 0.3);
  --selection-bg: rgba(191, 143, 82, 0.22);
  --overlay-bg: rgba(0, 0, 0, 0.58);
  --color-success: #8fbe92;
  --color-warning: #d8a657;
  --color-danger: #e86a86;
  --color-info: #bf8f52;
  /* 暗底上朱砂 #b8453a 对卡片底仅 2.65:1，提到 3:1 图形基准以上 */
  --color-seal: #d4574a;
  --color-seal-ink: #1f0a07;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.22), 0 1px 3px rgba(0, 0, 0, 0.28);
  --shadow-md: 0 6px 16px rgba(0, 0, 0, 0.34);
  --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.46);
  --shadow-popover: 0 8px 28px rgba(0, 0, 0, 0.46);
  --shadow-modal: 0 30px 86px rgba(0, 0, 0, 0.52);
}

/* ============================================================
   调色盘 —— 用户自定义强调色
   html[data-accent] 由 AccentContext 写入。未自定义时保持上方
   手调品牌值（零漂移）；自定义时从 --accent-base 派生 accent 家族，
   深色主题向白提亮 22% 保证暗底可读。墨色（--accent-ink）由 JS
   按对比度写入 --accent-ink-light / --accent-ink-dark。
   ============================================================ */

html[data-accent] {
  --accent: var(--accent-base);
  --accent-hover: color-mix(in oklch, var(--accent) 88%, #000);
  --accent-light: color-mix(in oklch, var(--accent) 16%, var(--bg-card));
  --accent-subtle: color-mix(in oklch, var(--accent) 9%, var(--bg-card));
  --focus-ring: color-mix(in oklch, var(--accent) 26%, transparent);
  --selection-bg: color-mix(in oklch, var(--accent) 45%, transparent);
  --color-info: var(--accent);
}

html[data-accent][data-theme='dark'] {
  --accent: color-mix(in oklch, var(--accent-base) 78%, #fff);
  --accent-hover: color-mix(in oklch, var(--accent) 88%, #fff);
}

.ai-admin-page {
  min-width: 0;
  max-width: 100%;
  overflow-x: hidden;
}

.ai-service-tabs {
  gap: 1rem;
}

.ai-service-tabs__content {
  margin-top: 0;
}

/* AI service form controls use consistent widths across configuration panels.
   Numeric fields stay compact while text-like fields remain readable without
   stretching across an entire card. */
.ai-admin-page [data-slot='input'],
.ai-generation-dialog [data-slot='input'] {
  width: min(100%, 28rem);
  justify-self: start;
}

.ai-admin-page [data-slot='input'][type='number'],
.ai-generation-dialog [data-slot='input'][type='number'] {
  width: min(100%, 9rem);
}

/* Keep labels, controls, and helper copy on one predictable left edge. */
.ai-admin-page :is(.admin-form-field, div.grid.gap-1\.5):has(> [data-slot='input']),
.ai-admin-page :is(.admin-form-field, div.grid.gap-1\.5):has(> textarea),
.ai-admin-page :is(.admin-form-field, div.grid.gap-1\.5):has(> [data-slot='select-trigger']),
.ai-generation-dialog :is(.admin-form-field, div.grid.gap-1\.5):has(> [data-slot='input']) {
  min-width: 0;
  align-content: start;
}

.ai-admin-page [data-slot='select-trigger'],
.ai-generation-dialog [data-slot='select-trigger'] {
  justify-self: start;
}

.ai-generation-dialog .ai-generation-publish {
  align-items: flex-start;
}

.ai-admin-page :is(.admin-form-field, div.grid.gap-1\.5) > p.text-xs,
.ai-generation-dialog :is(.admin-form-field, div.grid.gap-1\.5) > p.text-xs {
  max-width: 28rem;
}

/* Form rows choose their column count from the available card width. This
   keeps short numeric fields on one balanced row instead of leaving a large
   empty area when a fixed three-column grid wraps. */
.ai-admin-page .ai-form-grid {
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 15rem), 18rem));
  justify-content: start;
}

.ai-admin-page .ai-form-grid > :is(.admin-form-field, .grid.gap-1\.5) {
  min-width: 0;
}

.ai-admin-page .ai-provider-section {
  max-width: 100%;
}

.ai-config-panel {
  display: grid;
  gap: 0.75rem;
}

.ai-config-providers {
  display: grid;
  gap: 1.5rem;
}

.ai-config-secondary {
  display: grid;
  gap: 0.75rem;
}

.ai-config-panel .ai-provider-section .ai-form-grid {
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 18rem), 1fr));
}

.ai-config-panel .ai-provider-section {
  gap: 1rem;
}

.ai-config-panel .ai-provider-section [data-slot='input'] {
  width: 100%;
  max-width: none;
}

.ai-config-panel .ai-provider-section > :is(.admin-form-field, .grid.gap-1\.5) [data-slot='input'] {
  max-width: 42rem;
}

.ai-config-panel .ai-provider-actions,
.ai-config-panel .ai-config-test {
  border-top: 1px solid var(--border);
  padding-top: 0.75rem;
}

.ai-config-panel .ai-provider-actions [data-slot='button'],
.ai-config-panel .ai-config-test [data-slot='button'] {
  min-width: 8.5rem;
}

.ai-config-panel .ai-config-limits {
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 16rem), 1fr));
  padding-top: 0.25rem;
}

.ai-config-panel .ai-config-limits [data-slot='input'] {
  width: min(100%, 11rem);
}

.ai-config-usage {
  display: grid;
  gap: 0.75rem;
}

.ai-config-usage-group {
  display: grid;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: var(--admin-radius-sm);
}

.ai-config-usage-group-label {
  padding: 0.45rem 0.75rem;
  border-bottom: 1px solid var(--border);
  background: var(--admin-panel-muted);
  color: var(--text-muted);
  font-size: 0.7rem;
  font-weight: 650;
}

.ai-config-usage-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 1px;
  background: var(--border);
}

.ai-config-usage-grid--two {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

.ai-config-usage-grid > div {
  padding: 0.7rem 0.75rem;
}

/* AI 创作是连续工作流：模式靠近标题，字段与创作说明按层级排开。
   标题条已由 AdminPanelHeading 承担，模式选择器位于其 actions 槽位。 */
.ai-writing-panel .admin-panel-heading [data-slot='tabs-list'] {
  height: 2.25rem;
}

.ai-writing-panel .ai-writing-basics {
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 1.5rem;
}

.ai-writing-panel .ai-writing-basics [data-slot='input'] {
  width: 100%;
  max-width: none;
}

.ai-writing-panel .ai-writing-novel-select {
  max-width: none;
}

.ai-writing-panel .ai-writing-chapter-title [data-slot='input'] {
  width: 100%;
  max-width: none;
}

.ai-writing-panel .ai-writing-options {
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 12rem), 1fr));
  align-items: end;
  gap: 1.5rem;
  padding: 0;
  border: 0;
}

.ai-writing-number-input {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.ai-writing-number-input [data-slot='input'] {
  width: 8.75rem;
}

.ai-writing-number-input span {
  color: var(--text-muted);
  font-size: 0.875rem;
}

.ai-writing-panel .ai-writing-notes textarea {
  min-height: 7rem;
}

/* 创作要求下方是「推荐情节」的辅助行，不是第二个内容输入框。
   此前侧重点输入框紧贴 textarea、视觉权重相同，用户会把它当成续写要求的一部分
   接着写；而触发它的按钮远在标签行右端，参数与操作被拆开。

   本轮进一步去掉外层盒子：原实现是「暖底容器 + 内层白框输入框」的双层结构，
   与紧邻的创作要求并排时，读起来是两个平级盒子而不是「主输入 + 它的附属参数」。
   现在改成一条无容器的下沉参数行：只有输入框自身有边界，整行靠缩进与弱化色
   表达从属关系，层级由「盒子」改为「位置与灰度」。 */
.ai-writing-assist {
  display: flex;
  align-items: center;
  gap: 0.625rem;
  /* 向左缩进一点，与创作要求正文形成视觉从属；不再有外框与底色 */
  padding-left: 0.125rem;
}

/* 侧重点输入框：比系统默认输入框更弱一档（下沉底色 + 更浅描边），
   与上方被强调的创作要求拉开差距，坐实它只是给按钮用的参数。

   选择器必须写成 .ai-writing-panel .ai-writing-assist > …：仅用
   .ai-writing-assist > … 与 .admin-layout [data-slot='input']（均为 0,2,0）
   特异性相同，而后者在文件更后面，会直接赢下这条级联 —— 实测如此，
   写弱化的声明全部被覆盖，输入框仍是系统默认的白底标准边框。 */
.ai-writing-panel .ai-writing-assist > [data-slot='input'] {
  flex: 1 1 auto;
  min-width: 0;
  height: 2.25rem;
  border-color: var(--admin-border);
  background: var(--admin-panel-muted);
  font-size: 0.8125rem;
}

.ai-writing-panel .ai-writing-assist > [data-slot='input']:focus-visible {
  border-color: var(--sh-primary);
  background: var(--bg-card);
}

.ai-writing-assist > [data-slot='button'] {
  flex: 0 0 auto;
}

/* 「推荐情节」候选：一组方向建议，选一条填入左侧创作要求。

   原实现是 border-radius: 0 的裸边框块堆叠 —— 同页面的面板 20px、输入框与按钮
   12px，圆角契约里没有 0px 这一档；五张直角长卡（实测 1088×83）叠起来是一片
   文本墙，每行约 77 个全角字，远超可扫描字宽。

   圆角、焦点环与选中回执沿用到本轮（此前点完看不出取了哪一条）。排布则从
   「整幅两列网格」改为「创作要求右侧的单列面板」：候选与它要填入的正文同屏，
   点选后无需滚回上方核对；两列网格由外层 .ai-writing-brief-layout 承担。 */
/* 候选卡容器：分栏后为单列堆叠（候选列本身已较窄，再分两列会挤成竖条）。 */
.ai-writing-suggest {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 0.5rem;
  min-width: 0;
}

/* 候选卡与主输入框同一套「白色内容层」语言：白底 + 中性描边，
   只有 hover 与选中态才引入暖色。三者（创作要求 / 候选卡 / 大纲）因此读起来
   是同一族控件，靠位置与灰度分主次，而不是各自一种盒子样式。 */
.ai-writing-suggest__item {
  display: flex;
  flex-direction: row;
  align-items: flex-start;
  gap: 0.625rem;
  padding: 0.625rem 0.875rem;
  border: 1px solid var(--admin-border);
  border-radius: var(--admin-input-radius);
  background: var(--bg-card);
  color: var(--text-primary);
  text-align: left;
  transition:
    border-color var(--admin-table-row-interaction),
    background-color var(--admin-table-row-interaction);
}

.ai-writing-suggest__item:hover {
  border-color: color-mix(in srgb, var(--accent) 40%, var(--admin-border));
  background: var(--admin-table-row-hover-background);
}

.ai-writing-suggest__item:focus-visible {
  outline: none;
  border-color: var(--sh-primary);
  box-shadow: 0 0 0 2px var(--focus-ring);
}

/* 这些按钮执行的是「把该条文本填进创作要求」，不是持久化的选择，
   故用 aria-pressed 表达「它当前是否就是框里的那一份」，读屏可播报该状态。
   选中态是唯一使用暖底的位置：此刻这条正文确实就是创作要求框里的内容。 */
.ai-writing-suggest__item[aria-pressed='true'] {
  border-color: color-mix(in srgb, var(--accent) 55%, var(--admin-border));
  background: var(--accent-subtle);
}

.ai-writing-suggest__direction {
  font-size: 0.875rem;
  line-height: 1.6;
}

.ai-writing-suggest__effect {
  display: flex;
  gap: 0.375rem;
  align-items: flex-start;
  /* 同一行两张卡正文长短不一时，把效果行压到底部，两卡的效果行对齐成一条线 */
  margin-top: auto;
  padding-top: 0.25rem;
  color: var(--text-muted);
  font-size: 0.75rem;
  line-height: 1.5;
}

.ai-writing-suggest__effect > svg {
  flex: 0 0 auto;
  margin-top: 0.1875rem;
  color: var(--accent);
}

@media (prefers-reduced-motion: reduce) {
  .ai-writing-suggest__item {
    transition: none;
  }
}

/* 创作要求主区。

   这一段是整页权重最高的输入：它逐章下发，直接决定模型写什么。此前它只是
   「一个标签 + 一个 textarea」，与下方「侧重点」输入框在视觉上同级（同宽、
   同描边、同圆角、间距都是 1.5rem），用户会把两者都当成创作要求；而空着
   会怎样也没有任何提示，只能靠试。这里给它标题行、字数回执和一句随状态
   变化的说明，让它自己撑起主区身份，无需靠额外装饰。 */
.ai-writing-brief {
  display: grid;
  gap: 0.5rem;
}

/* 左「创作要求」/ 右「候选」两栏。

   候选的用途就是填进创作要求，点完必须能立刻看到左侧正文的变化；上下排布时
   两者相隔一屏，用户点完还得滚回去核对填了什么。同屏后这个动作才闭环。

   左列因此收窄到约半幅：原来整幅 1248px 时一行可容上百个全角字，远超舒适
   阅读宽度（约 65–75ch），分栏后自然落进可读区间，属于顺带修正。

   候选列给定高度上限并内部滚动，避免「五条长候选」把左列正文顶出视野 ——
   那样分栏就失去了意义。 */
.ai-writing-brief-layout {
  display: grid;
  gap: 1.25rem;
  /* 两列等高：候选列较高时左列随之拉伸，创作要求的书写区一并变高，
     既消掉左列下方的空白，也把空间给了真正要写长文的那个框。 */
  align-items: stretch;
}

.ai-writing-brief-layout__main {
  display: grid;
  gap: 0.75rem;
  min-width: 0;
}

.ai-writing-brief-layout__aside {
  min-width: 0;
}

/* 宽屏才分栏。分栏阈值取 78rem：低于此宽度时左列会被压到 40 个全角字以下，
   与右列的候选正文互相挤压，不如退回上下堆叠。 */
@media (min-width: 78rem) {
  .ai-writing-brief-layout {
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr);
    gap: 1.5rem;
  }

  /* 尚无候选时右列没有内容可承载，此时分栏只会留下一片空列。
     让左列在这段时间独占整幅：创作要求因此立刻拿到宽书写区，
     取回候选后再分栏，右列出现的位置也正好是用户点过按钮的地方。 */
  .ai-writing-brief-layout.is-aside-empty {
    grid-template-columns: minmax(0, 1fr);
  }

  /* 左列内部：创作要求吸收剩余高度，侧重点行保持自然高度 */
  .ai-writing-brief-layout__main {
    grid-template-rows: minmax(0, 1fr) auto;
  }

  .ai-writing-brief-layout__main .ai-writing-brief {
    grid-template-rows: auto minmax(0, 1fr) auto;
  }

  /* 让输入框填满被拉伸出来的高度 */
  .ai-writing-panel .ai-writing-brief-layout__main .ai-writing-brief textarea {
    height: 100%;
  }

  /* 候选列内部滚动：条目再多也不会把左列正文顶出视野，
     两列因此始终同屏，「点选 → 看左侧变化」的动作闭环。 */
  .ai-writing-brief-layout__aside .ai-writing-suggest {
    grid-template-columns: minmax(0, 1fr);
    max-height: 26rem;
    overflow-y: auto;
    padding-right: 0.25rem;
  }
}

/* 标题行定高：左列「创作要求 / 未填写」是 19px 文本，右列含一个 24px 的「收起」
   按钮，两列首行会差 5px 而非对齐。这里统一两列标题行的行盒高度，
   并把按钮改为不撑高行盒的尺寸，使左右顶端落在同一条基线上。 */
.ai-writing-brief__head,
.ai-writing-suggest-block__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  min-height: 1.5rem;
}

/* 字号回执与提示文字仍需与标签基线一致，故在居中布局下单独对齐文本 */
.ai-writing-brief__head {
  align-items: baseline;
}

.ai-writing-suggest-block__head > [data-slot='button'] {
  flex: 0 0 auto;
  height: 1.5rem;
  padding-inline: 0.5rem;
}

/* 字数回执：只做低强度计量，不喧宾夺主，故用弱化色与小字号 */
.ai-writing-brief__count {
  color: var(--text-muted);
  font-size: 0.75rem;
  font-variant-numeric: tabular-nums;
}

.ai-writing-brief__hint {
  color: var(--text-muted);
  font-size: 0.75rem;
  line-height: 1.6;
}

/* 主输入框是页面上唯一被强调的输入框：白底 + 暖色描边，在奶油面板上最亮、最靠前。
   刻意不用 accent-subtle 做底 —— 那个暖色是「弱化辅助参数」的语义（见下方
   .ai-writing-assist），若主输入也用它，就会与紧邻的侧重点行同色，
   两块并排变成「一个装正文的暖盒子 + 一个装参数的暖盒子」，主次被抹平。
   注意也不能用 --admin-border-strong 做区隔：实测它正是 .admin-layout 下
   所有 textarea 的默认边框色，改了等于没改。 */
.ai-writing-panel .ai-writing-brief textarea {
  min-height: 8rem;
  border-color: color-mix(in srgb, var(--accent) 34%, var(--admin-border));
  background: var(--bg-card);
  box-shadow: 0 1px 2px color-mix(in srgb, var(--accent) 10%, transparent);
}

.ai-writing-panel .ai-writing-brief textarea:focus-visible {
  border-color: var(--sh-primary);
  background: var(--bg-card);
}

/* 尚未取候选时的内联提示。
   此前是一整块虚线空态，与左列等高后右下方空出一大片（实测约 400px），
   既浪费空间又把视线从创作要求上拖走；而它承载的信息只有「候选从哪来」
   一句话。改为与「侧重点」行等高的一行提示，且左侧图标用暖色作为锚点。
   单列布局下它跟在侧重点行之后，取回候选后原地变成右侧列表。 */
.ai-writing-suggest-placeholder {
  display: flex;
  align-items: flex-start;
  gap: 0.5rem;
  /* 与 .ai-writing-assist 的控件高度对齐，两行读起来是同一层级的辅助信息 */
  min-height: 2.25rem;
  padding-top: 0.375rem;
  color: var(--text-muted);
  font-size: 0.75rem;
  line-height: 1.6;
}

.ai-writing-suggest-placeholder > svg {
  flex: 0 0 auto;
  margin-top: 0.1875rem;
  color: var(--accent);
  opacity: 0.8;
}

/* 分栏后单列堆叠，候选卡不再需要「同行两卡等高」的对齐处理，
   但仍保留 min-width: 0 以防长英文串撑破列宽。 */
.ai-writing-suggest-block {
  display: grid;
  gap: 0.5rem;
  min-width: 0;
}

.ai-writing-suggest-block__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  /* 与左侧字行回执同一行高，两列首行因此对齐 */
  min-height: 1.25rem;
}

.ai-writing-suggest-block__head p {
  line-height: 1.6;
}

/* 候选卡改为「序号 + 正文」两栏：序号给稳定锚点，方便在多条长文案间
   口头或视觉指认（此前只能靠读整句）。序号是卡内的次级标记，
   用描边而非填色，避免在白底卡上再多出一个色块。 */
.ai-writing-suggest__index {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 1.25rem;
  height: 1.25rem;
  border: 1px solid var(--admin-border);
  border-radius: 999px;
  background: transparent;
  color: var(--text-muted);
  font-size: 0.6875rem;
  font-variant-numeric: tabular-nums;
}

.ai-writing-suggest__item[aria-pressed='true'] .ai-writing-suggest__index {
  border-color: color-mix(in srgb, var(--accent) 40%, var(--admin-border));
  color: var(--accent);
}

.ai-writing-suggest__body {
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
  min-width: 0;
}

/* 填入候选是整段覆盖创作要求，此前不可撤销。撤销条让这个高代价动作可逆。 */
.ai-writing-suggest-undo {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  padding: 0.375rem 0.375rem 0.375rem 0.75rem;
  border: 1px dashed var(--admin-border-strong);
  border-radius: var(--admin-input-radius);
  color: var(--text-muted);
  font-size: 0.75rem;
}

/* 大纲章数 vs 续写章数：给出「够 / 不够」的直接结论，取代让用户心算的计数句。 */
.ai-writing-outline-status {
  display: flex;
  align-items: flex-start;
  gap: 0.625rem;
  padding: 0.5rem 0.75rem;
  border: 1px solid var(--admin-border);
  border-radius: var(--admin-input-radius);
  font-size: 0.75rem;
  line-height: 1.6;
}

.ai-writing-outline-status__figure {
  flex: 0 0 auto;
  color: var(--text-primary);
  font-size: 0.8125rem;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.ai-writing-outline-status__text {
  color: var(--text-muted);
}

/* 章数对齐用中性色（这是正常状态，不需要庆祝），不足才上警示色。 */
.ai-writing-outline-status.is-ok {
  border-color: var(--admin-border);
  background: var(--admin-panel-muted);
}

.ai-writing-outline-status.is-short {
  border-color: color-mix(in srgb, var(--color-warning) 45%, transparent);
  background: color-mix(in srgb, var(--color-warning) 10%, transparent);
}

.ai-writing-outline-status.is-short .ai-writing-outline-status__figure {
  color: var(--color-warning);
}

/* 侧重点的可见标签：坐实它是「给按钮用的参数」，不是第二处创作要求 */
.ai-writing-assist__label {
  flex: 0 0 auto;
  padding-left: 0.25rem;
  color: var(--text-muted);
  font-size: 0.75rem;
  white-space: nowrap;
}

/* 画像区：标题行本身是可展开控件。

   三张画像（风格 / 关系 / 情节状态）合计实测 913px，占续写模式整页 43%，
   而它们是「提取一次、长期复用」的资产 —— 每次执行任务都要滚过这段基本
   不变的文本。默认折叠后只留三行标题（画像名 + 已提取状态 + 操作），
   需要核对内容时点开。

   标题从 <label> 换成 <button>：label 不能嵌在 button 里，且折叠触发器必须
   是真实按钮才能键盘操作与播报 aria-expanded。字号字重沿用标签规格，
   视觉上仍是「一组字段的标题」，不是链接。 */
.ai-profile-trigger {
  display: inline-flex;
  align-items: center;
  gap: 0.375rem;
  padding: 0.125rem 0.25rem;
  margin-inline: -0.25rem;
  border: 0;
  border-radius: var(--radius-sm);
  background: none;
  color: var(--text-primary);
  font-family: inherit;
  font-size: 0.875rem;
  font-weight: var(--admin-field-label-weight);
  line-height: 1;
  cursor: pointer;
}

.ai-profile-trigger:hover {
  background: var(--admin-panel-muted);
}

.ai-profile-trigger:focus-visible {
  outline: none;
  box-shadow: 0 0 0 2px var(--focus-ring);
}

/* 箭头仅在「已提取、有内容可展开」时出现，避免未提取时暗示有东西可看。
   旋转态挂在 aria-expanded 上，而不是 Radix 的 data-state —— 触发器是独立
   button，不是 CollapsibleTrigger，不会获得 data-state（实测该选择器
   永不匹配，箭头因此始终朝右）。 */
.ai-profile-trigger__caret {
  flex: 0 0 auto;
  color: var(--text-muted);
  transition: transform var(--admin-table-row-interaction);
}

.ai-profile-trigger[aria-expanded='true'] .ai-profile-trigger__caret {
  transform: rotate(90deg);
}

@media (prefers-reduced-motion: reduce) {
  .ai-profile-trigger__caret {
    transition: none;
  }
}

/* 封面历史的折叠触发器与画像触发器同规格：都是「一组内容的标题」，
   只是折叠对象不同。共用一套规则，避免两处样式各自漂移。 */
.ai-history-trigger {
  display: inline-flex;
  align-items: center;
  gap: 0.375rem;
  padding: 0.125rem 0.25rem;
  margin-inline: -0.25rem;
  border: 0;
  border-radius: var(--radius-sm);
  background: none;
  color: var(--text-primary);
  font-family: inherit;
  font-size: 0.875rem;
  font-weight: var(--admin-field-label-weight);
  line-height: 1;
  cursor: pointer;
}

.ai-history-trigger:hover {
  background: var(--admin-panel-muted);
}

.ai-history-trigger:focus-visible {
  outline: none;
  box-shadow: 0 0 0 2px var(--focus-ring);
}

.ai-history-trigger__caret {
  flex: 0 0 auto;
  color: var(--text-muted);
  transition: transform var(--admin-table-row-interaction);
}

.ai-history-trigger[aria-expanded='true'] .ai-history-trigger__caret {
  transform: rotate(90deg);
}

@media (prefers-reduced-motion: reduce) {
  .ai-history-trigger__caret {
    transition: none;
  }
}

/* 窄屏下输入框与按钮挤在一行会把 placeholder 截断、按钮压到刚够两个字。
   改为上下堆叠，两者都拿到整行宽度。 */
@media (max-width: 640px) {
  /* 窄屏下输入框与按钮挤在一行会把 placeholder 截断、按钮压到刚够两个字，
     改为上下堆叠。这一行已不再有外框，故不设内缩，与创作要求左对齐。 */
  .ai-writing-assist {
    flex-direction: column;
    align-items: stretch;
    gap: 0.5rem;
    padding-left: 0;
  }

  .ai-writing-assist > [data-slot='button'] {
    width: 100%;
  }

  /* 窄屏下侧重点标签独占一行，避免与 placeholder 抢宽度 */
  .ai-writing-assist__label {
    padding-left: 0;
  }

  /* 撤销条在窄屏上下堆叠：文案 + 按钮各占整行，按钮不再被压成两个字 */
  .ai-writing-suggest-undo {
    flex-direction: column;
    align-items: stretch;
    gap: 0.5rem;
    padding: 0.5rem;
  }

  .ai-writing-suggest-undo > [data-slot='button'] {
    width: 100%;
  }
}

/* R18 展开后的档位选择项：整块内缩并下沉底色，与上方开关形成从属关系，
   避免展开的档位选择看起来与「成人内容」平级。 */
.ai-writing-consent {
  padding: 0.75rem 0.875rem;
  border: 1px solid var(--admin-border);
  border-radius: var(--admin-radius);
  background: var(--admin-panel-muted);
}

/* 窄屏下确认项再收一档内边距。它嵌在开关行之下，两层内缩在 400px 视口里要吃掉
   约 24px，档位选择框的文案因此多折一行。收窄只作用于确认项，不影响开关行。 */
@media (max-width: 640px) {
  .ai-writing-consent {
    padding: 0.625rem 0.75rem;
  }
}

/* ——— 小屏触控目标命中区 ———
   WCAG 2.2 2.5.8（AA）要求目标至少 24×24；审计报告写的 44px 实为 2.5.5（AAA）
   的门槛，本设计系统的紧凑档与之直接冲突，故按 AA 达标而非强行放大视觉尺寸。

   实测（390px 视口，AI 服务全部面板）：绝大多数控件已达标 —— 按钮 40px、分段 tabs
   32px、下拉 32~36px、开关 32×18.4（有外层 label 包裹，有效目标 326×20）。
   真正不达 AA 的只有两类：
     1. 表格内独立 Checkbox（内容预览列表）16×16，无外层 label；
     2. 内容预览的标题 <a> 高度 18.8px。
   两者都是替换/内联元素，::after 对 input 无效，故用「透明描边 + 外扩」的方式
   扩命中区：给元素加 4px 透明边框并把负外边距抵消，视觉尺寸不变，点击区域达到
   24×24。仅在 900px 及以下（触屏为主的断点）生效，桌面保持原样。 */
@media (max-width: 900px) {
  /* 表格单元格内的 Checkbox（Radix 渲染为 button，非替换元素，::after 可用）。
     不能用 padding 扩：元素已 box-sizing: border-box 且 size-4 定死 16×16，
     加内边距只会挤压内容、不会放大元素。故用绝对定位的透明 ::after 把命中区
     撑到 24×24，并以 50% 定位居中，视觉与布局均不变。 */
  .ai-generations-card td [data-slot='checkbox'] {
    position: relative;
  }

  .ai-generations-card td [data-slot='checkbox']::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 24px;
    height: 24px;
    transform: translate(-50%, -50%);
  }

  /* 内容预览的标题链接：同一单元格内「书名链接」与「📖 章节链接」上下紧贴，
     中心距实测仅 17.4px，两个目标都低于 24 —— 间距例外也救不了（例外要求相邻
     目标中心距 ≥24），故必须实打实放大命中盒。

     难点是要在不移动文字的前提下把盒子从 16~18.8px 撑到 24px：单纯加
     padding-block 会把文字下推；加 padding 再用负 margin 抵消，负 margin 又会在
     块级容器里与相邻块合并，实测造成后续链接累计下移 4~8px、行高 +4px。

     解法是把包裹链接的 div 变成 flex column —— flex 项的 margin 不与任何东西
     合并，于是 padding-block: 4px 把盒子撑到 24~26.8px，margin-block: -4px 再把
     占位高度扣回原值，净占位与文字位置都不变，只有可点击区域变大。
     链接带 Tailwind 的 truncate（overflow: hidden），不能用绝对定位的 ::after
     扩命中区（实测伪元素确实为 294×24，但被裁剪后命中高度只有 20px）。 */
  .ai-generation-row td div:has(> a) {
    display: flex;
    flex-direction: column;
    align-items: stretch;
  }

  .ai-generation-row td a {
    padding-block: 4px;
    margin-block: -4px;
  }
}

.ai-writing-panel .ai-writing-actions > .flex:last-child [data-slot='button'] {
  min-width: 7.5rem;
}

/* 续写工作台按一次任务的决策顺序排布：先定对象与规模，再确认续写基线，随后写
   本次情节并生成。每一段仍是同一张纸面，靠留白和细分隔建立层次，不叠加卡片。 */
.ai-writing-panel .ai-writing-workspace {
  display: grid;
  gap: 0;
}

.ai-writing-workspace > :where(.ai-writing-baseline, .ai-writing-notes, .ai-writing-actions, .ai-writing-identity + .ai-writing-actions) {
  border-top: 1px solid var(--admin-border);
  padding-top: 1.5rem;
}

.ai-writing-identity,
.ai-writing-baseline,
.ai-writing-analysis,
.ai-writing-content-scope {
  display: grid;
  gap: 1.25rem;
}

.ai-writing-section-heading {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 1rem;
}

.ai-writing-section-heading h3 {
  margin: 0;
  color: var(--text-primary);
  font-size: 0.95rem;
  font-weight: 700;
  letter-spacing: -0.015em;
  line-height: 1.35;
}

.ai-writing-section-heading p {
  max-width: 72ch;
  margin: 0.35rem 0 0;
  color: var(--text-muted);
  font-size: 0.75rem;
  line-height: 1.6;
}

.ai-writing-identity__mode,
.ai-writing-baseline__novel,
.ai-writing-analysis__count {
  flex: 0 1 auto;
  min-width: 0;
  border-radius: 999px;
  background: var(--admin-panel-muted);
  color: var(--text-muted);
  font-size: 0.75rem;
  line-height: 1.25rem;
  overflow: hidden;
  padding: 0.125rem 0.625rem;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.ai-writing-baseline {
  margin-top: 1.5rem;
}

.ai-writing-baseline > :where(.ai-writing-continuation-start, .ai-writing-content-scope, .ai-writing-analysis) {
  border-top: 1px solid var(--admin-border);
  padding-top: 1.25rem;
}

.ai-writing-continuation-start {
  max-width: 28rem;
}

.ai-writing-continuation-start__status {
  margin: 0;
  color: var(--text-muted);
  font-size: 0.75rem;
  line-height: 1.6;
}

.ai-writing-run-scale__choices {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.ai-writing-run-scale__choices [data-slot='button'] {
  min-width: 6.75rem;
}

.ai-writing-content-scope__toggle {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 1rem;
  border: 1px solid var(--admin-border);
  border-radius: var(--admin-input-radius);
  background: var(--admin-panel-muted);
  cursor: pointer;
  padding: 0.875rem 1rem;
}

.ai-writing-content-scope__toggle:has([data-slot='switch']:focus-visible) {
  border-color: var(--sh-primary);
  box-shadow: 0 0 0 2px var(--focus-ring);
}

.ai-writing-content-scope__toggle > [data-slot='switch'] {
  flex: 0 0 auto;
  margin-top: 0.125rem;
}

.ai-writing-profile-list {
  display: grid;
  border-top: 1px solid var(--admin-border);
}

.ai-writing-profile-list > * {
  min-width: 0;
  border-bottom: 1px solid var(--admin-border);
  padding: 1rem 0;
}

.ai-writing-profile-list > *:last-child {
  padding-bottom: 0;
  border-bottom: 0;
}

.ai-writing-profile-list .ai-profile-trigger,
.ai-writing-profile-list .inline-flex.items-center.gap-2\.5 {
  font-size: 0.875rem;
}

.ai-writing-workspace > .ai-writing-notes {
  gap: 1.5rem;
  margin-top: 1.5rem;
}

.ai-writing-workspace > .ai-writing-actions {
  margin-top: 1.5rem;
}

.ai-writing-section-heading--actions {
  align-items: flex-end;
}

.ai-writing-launch-summary {
  margin: 0;
  border-left: 1px solid color-mix(in srgb, var(--accent) 52%, var(--admin-border));
  color: var(--text-secondary);
  font-size: 0.8125rem;
  line-height: 1.65;
  padding-left: 0.75rem;
}

@media (max-width: 640px) {
  .ai-writing-section-heading {
    align-items: stretch;
    flex-direction: column;
    gap: 0.5rem;
  }

  .ai-writing-identity__mode,
  .ai-writing-baseline__novel,
  .ai-writing-analysis__count {
    align-self: flex-start;
    max-width: 100%;
  }

  .ai-writing-run-scale__choices {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .ai-writing-run-scale__choices [data-slot='button'] {
    min-width: 0;
    width: 100%;
  }

  .ai-writing-content-scope__toggle {
    padding: 0.75rem;
  }
}

/* AI 任务采用列表行而不是逐项卡片，便于扫描状态并横向完成操作。
   注：此处原有的 .ai-tasks-panel .ai-tasks-filter [data-slot='select-trigger']
   { width: 7.5rem } 已删除 —— .ai-tasks-filter 在 TSX 中已不存在（grep 全仓 0 命中），
   该规则是死代码。宽度现由组件上的 min-w-[7.5rem] 承担，与其余筛选器一致。
   （真正压制该 min-width 的是下方 .admin-toolbar > * 的 min-width: 0，已在那里修正。） */

/* AI 面板的纵向堆叠：替代原先手写的 space-y-4，间距走统一刻度。 */
.ai-service-stack {
  display: grid;
  min-width: 0;
  gap: 1rem;
}

/* 面板内主体（表格与页脚）的内边距，补偿 CardContent 不再存在后的留白。
   .ai-tasks-content 与 .ai-list-body 是同一语义的两个类名（各自面板的主体
   容器），此前只有后者在 ≤900px 收窄，同族面板的左右留白因此相差 4px，
   面板内工具条也就无法与下方数据区共用一条左基线。合并为一条规则。 */
.ai-list-body,
.ai-tasks-panel .ai-tasks-content {
  min-width: 0;
  padding: 0 1.25rem 1.25rem;
}

/* 调用审计表含跨列展开行，保留原生 table 并给横向滚动边界。
   不套用 AdminDataPanel 的卡片化（不加 .admin-data-panel--grid），避免 900px 以下
   td 被折成字段后跨列详情行错配。已生成内容表已改用范本契约（见下方说明），
   这里只补滚动边界。 */
.ai-audit-table {
  min-width: 0;
  max-width: 100%;
  overflow-x: auto;
}

/* 已生成内容表已收敛到 AdminDataPanel 契约（columns + shadcn Table + data-*），
   与小说管理同源。原先这里有一条 @container (max-width: 48rem) 块，为该表
   自带 min-w-[760px] 造成的 901–1100px 破版带打补丁；改用 fixed 布局与百分比
   列宽后表格不再需要最小宽度，溢出从根上消失，该块随之删除。
   本表也不再使用 sticky 冻结列——fixed 布局下列宽已由 columns 预先分配，
   横向滚动不会发生，冻结列失去存在理由，且它与卡片化互斥。 */

/* 关联内容列：小说名与章节名两行，与章节范本的主字段处理一致（主字段
   加粗、次级信息降一档并跟随 muted），避免两行等重导致的主次不分。 */
.ai-generations-card .ai-generation-related__title {
  display: block;
  overflow: hidden;
  color: var(--text-primary);
  font-weight: 500;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.ai-generations-card .ai-generation-related__title:hover {
  color: var(--accent);
  text-decoration: underline;
}

.ai-generations-card .ai-generation-related__sub {
  display: block;
  overflow: hidden;
  color: var(--text-muted);
  font-size: 0.75rem;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.ai-generations-card .ai-generation-related__sub:hover {
  color: var(--accent);
  text-decoration: underline;
}

/* 内容预览是长文本：桌面端截两行，完整内容经「查看」弹窗获得。
   用 -webkit-line-clamp 而非固定高度，行数随字号自适应。 */
.ai-generations-card .ai-generation-preview {
  display: -webkit-box;
  overflow: hidden;
  margin: 0;
  color: var(--text-muted);
  font-size: 0.75rem;
  line-height: 1.6;
  white-space: pre-line;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
}

/* 子行的预览只给一行：它是批次内的章节条目，摘要长度不该与主行等量，
   否则展开后视觉上分不出哪一行是批次、哪一行是章节。 */
.ai-generations-card .ai-generation-row--child .ai-generation-preview {
  -webkit-line-clamp: 1;
}

/* 模型名（如 deepseek-v4.1-flash）在固定列宽里会被中间截断成「deepsee」，
   且不带任何省略提示，看起来像数据损坏。改为单行省略 + title 承载全称。 */
.ai-generations-card .ai-generation-model {
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* 生成时间两行（日期 / 时间）各自不可断行：窄列下浏览器会在「10:52:03」
   中间折行，读起来像两个字段。日期与时间各自 nowrap，列不够时靠省略。 */
.ai-generations-card .ai-generation-time {
  display: flex;
  flex-direction: column;
}

.ai-generations-card .ai-generation-time > span {
  white-space: nowrap;
}

/* 子行是批次内的从属条目：用次级表面色区分层级，不给独立描边
   （Tonal-Admin Rule：面板内不再叠加边框造层次）。 */
.ai-generations-card .ai-generation-row--child {
  background: color-mix(in srgb, var(--admin-panel) 92%, var(--accent-subtle));
}

.ai-audit-table {
  border: 1px solid var(--admin-border);
  border-radius: var(--radius-xl);
}

.ai-audit-table__table {
  width: 100%;
  min-width: 48rem;
  border-collapse: collapse;
  font-size: 0.875rem;
}

.ai-audit-table__table thead {
  border-bottom: 1px solid var(--admin-border);
  background: var(--admin-panel-muted);
}

.ai-audit-table__table th {
  padding: 0.75rem 1rem;
  color: var(--text-muted);
  font-size: 0.75rem;
  font-weight: 650;
  text-align: left;
  white-space: nowrap;
}

.ai-audit-table__table td {
  padding: 0.75rem 1rem;
  vertical-align: top;
}

.ai-audit-table__table th.is-numeric,
.ai-audit-table__table td.is-numeric {
  text-align: right;
}

.ai-audit-row {
  border-bottom: 1px solid var(--admin-border);
  cursor: pointer;
}

.ai-audit-row:hover {
  background: var(--admin-panel-muted);
}

.ai-audit-row--detail {
  background: var(--admin-panel-muted);
  cursor: default;
}

/* 身份列内含展开按钮，与文本并排；文本块需要能收缩，否则长用户名撑破列宽。 */
.ai-audit-cell__identity {
  display: flex;
  align-items: flex-start;
  gap: 0.5rem;
  min-width: 0;
}

.ai-audit-cell__identity-text {
  min-width: 0;
}

/* 键盘与读屏用户进入行详情的唯一入口（鼠标仍可点整行）。
   本体 28px 见方：触控目标由整行 onClick 承担，此处只需满足键盘焦点与
   指针可命中，不把按钮撑到 44px 抬高整张表的行高。 */
.ai-audit-row__toggle {
  display: flex;
  flex: 0 0 auto;
  align-items: center;
  justify-content: center;
  width: 1.75rem;
  height: 1.75rem;
  margin: -0.25rem 0 -0.25rem -0.375rem;
  padding: 0;
  border: 0;
  border-radius: var(--radius-md);
  background: none;
  color: var(--text-muted);
  cursor: pointer;
  transition: color var(--admin-table-row-interaction);
}

.ai-audit-row__caret {
  width: var(--admin-table-sort-caret-size);
  height: var(--admin-table-sort-caret-size);
  transition: transform var(--admin-table-row-interaction);
}

.ai-audit-row:hover .ai-audit-row__toggle,
.ai-audit-row__toggle:hover,
.ai-audit-row__toggle:focus-visible {
  color: var(--text-primary);
}

/* 展开态旋转到朝下，与 ScrapeDisclosure 的箭头方向语义一致。 */
.ai-audit-row__toggle[aria-expanded='true'] .ai-audit-row__caret {
  transform: rotate(90deg);
}

@media (prefers-reduced-motion: reduce) {
  .ai-audit-row__caret {
    transition: none;
  }
}

.ai-audit-cell__name {
  color: var(--text-primary);
  font-weight: 600;
}

.ai-audit-cell__strong {
  color: var(--text-primary);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.ai-audit-cell__muted {
  color: var(--text-muted);
}

.ai-audit-cell__sub {
  color: var(--text-muted);
  font-size: 0.75rem;
  font-variant-numeric: tabular-nums;
}

.ai-audit-cell__content {
  max-width: 17.5rem;
}

.ai-audit-cell__content > div {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.ai-audit-detail {
  display: grid;
  gap: 0.75rem;
  grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr));
}

.ai-audit-detail__usage {
  display: flex;
  margin-top: 0.75rem;
  flex-wrap: wrap;
  gap: 1rem;
  color: var(--text-muted);
  font-size: 0.75rem;
}

.ai-audit-detail__usage strong {
  color: var(--text-primary);
  font-variant-numeric: tabular-nums;
}

@media (max-width: 900px) {
  /* 工具条与数据区的左右留白必须同步收窄。只改数据区会让面板内工具条
     比下方表格多出 4px 内缩，两条左基线再次错开。 */
  .ai-list-body,
  .ai-tasks-panel .ai-tasks-content {
    padding: 0 1rem 1rem;
  }

  .ai-service .ai-tasks-toolbar,
  .ai-service .ai-audit-toolbar,
  .ai-service .ai-generations-toolbar {
    padding-inline: 1rem;
  }

  .ai-audit-table {
    border-radius: var(--radius-lg);
  }
}

/* AI 任务面板已改为与小说管理同源的表格（AdminDataPanel + columns + Table），
   行高、表头、分隔线、hover 与移动卡片化全部由 .admin-data-panel--grid 承担，
   原先自定义的行列表规则（.ai-task-list / .ai-task-row / .ai-task-main /
   .ai-task-actions）随之删除——它们是「表格以外的第二套行系统」，
   正是本面板与范本行高差 59px（111 vs 52）的来源。 */

/* 结果列：主字段字号与范本一致，错误信息在其下用危险色补一行。
   此前错误信息是行内第三段文字，会与步骤、Prompt 争夺注意力；
   现并入主字段，层级从属于步骤。 */
.ai-tasks-panel .ai-task-step {
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* 错误信息允许换行：它是用户唯一能看到的失败线索（实测最长 33 字，
   单行 nowrap 会被裁掉后半截，把「已经告诉你原因」变成「莫名其妙失败」）。
   不设 line-clamp：错误原因必须完整可读，几行换行可接受。 */
.ai-tasks-panel .ai-task-error {
  display: block;
  margin-top: 0.25rem;
  color: var(--color-danger);
  font-size: 0.75rem;
  line-height: 1.45;
  white-space: normal;
  overflow-wrap: anywhere;
}

/* 输入 Prompt 是长文本，用单行省略 + title 承载全文：与范本对长文本的处理
   一致（桌面端不撑高行，完整内容仍可通过 title 与后续详情入口获得）。
   不用 nowrap 让它撑开列宽——fixed 布局下列宽已由 columns 决定。 */
.ai-tasks-panel .ai-task-prompt {
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Prompt 格的点击入口。此前「查看 Prompt」是操作列里的 32px 图标按钮，
   夹在「查看产出 / 重试 / 删除」之间；而操作列按钮数量随状态变化（进行中有
   取消、失败有重试、有产出才有查看产出），flex-start 排布下图标逐行横向漂移，
   扫描时同一位置的控件含义每行都不同。入口回到数据所属的格子后，操作列只剩
   状态相关的主行动，漂移的根源消失。

   按钮撑满单元格并继承文字色：视觉上仍是 Prompt 文本，不是可点的控件，
   避免整列长出 121 个按钮框。hover/focus 才用底色点出可点性。 */
.ai-tasks-panel .ai-task-prompt-button {
  display: block;
  width: 100%;
  min-width: 0;
  padding: 0.125rem 0.25rem;
  margin: -0.125rem -0.25rem;
  border: 0;
  border-radius: var(--radius-sm);
  background: transparent;
  color: inherit;
  font: inherit;
  text-align: left;
  cursor: pointer;
  transition: background-color var(--admin-table-row-interaction);
}

.ai-tasks-panel .ai-task-prompt-button:hover {
  background: var(--bg-hover);
}

.ai-tasks-panel .ai-task-prompt-button:focus-visible {
  outline: 2px solid var(--color-primary);
  outline-offset: 1px;
}

/* 卡片模式下 td 的 padding 为 0（见 .admin-data-panel--grid tbody td），
   此时 padding 与负外边距这对组合失去对齐意义，只会让按钮左右各溢出
   0.25rem 压到标签列上。移动端取消两者，文字回到 td 的默认起点。 */
@media (max-width: 900px) {
  .ai-tasks-panel .ai-task-prompt-button {
    padding: 0;
    margin: 0;
  }
}

/* ── Prompt 结构化视图 ─────────────────────────────────────────────────────
   弹窗展示的是真正发给模型的 user message，正文里的换行被 JSON 转义成字面
   \n、段落头后面还挂着写给模型的英文防注入约束，直接塞进 <pre> 几乎不可读。
   parsePromptView 把这些材料块解析出来后，用这里的层级呈现：
   材料块标题 → 段落 → 单块（可折叠）。
   注意：只做展示层排版，不改变任何发往模型的内容。 */

/* 视图切换行：左侧小标题沿用弹窗既有 section label，右侧是切换按钮。 */
.ai-prompt-view__switch {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  flex-wrap: wrap;
}

/* 元信息行：流水线版本、是否含任务要求。弱化处理，它是脚注不是正文。 */
.ai-prompt-view__meta {
  margin: 0 0 0.75rem;
  color: var(--text-muted);
  font-size: 0.72rem;
  line-height: 1.5;
}

.ai-prompt-view__section + .ai-prompt-view__section {
  margin-top: 1rem;
}

/* 段落头：中文段名 + 该段性质说明。性质说明用来替代原文那句英文约束，
   让用户能分辨「只作参考的资料」与「本次要执行的要求」——这两类在提示词里
   是刻意分开的，资料块混入执行语义会让模型按更保守的一侧处理。 */
.ai-prompt-view__section-head {
  display: flex;
  align-items: baseline;
  gap: 0.5rem;
  flex-wrap: wrap;
  margin-bottom: 0.5rem;
  padding-bottom: 0.375rem;
  border-bottom: 1px solid var(--border-light);
}

.ai-prompt-view__section-head h4 {
  margin: 0;
  color: var(--text-primary);
  font-size: 0.8rem;
  font-weight: 600;
}

.ai-prompt-view__section-head span {
  color: var(--text-muted);
  font-size: 0.72rem;
}

/* 指令型段落（作者要求）用强调色区分于资料型，但不单独靠颜色承载语义。 */
.ai-prompt-view__section[data-instructions] .ai-prompt-view__section-head h4 {
  color: var(--color-info);
}

/* 单块：默认折叠的长材料（整章正文可达上万字），summary 是块级标题行。 */
.ai-prompt-view__block {
  border: 1px solid var(--border-light);
  border-radius: var(--radius-sm);
  background: var(--bg-secondary);
}

.ai-prompt-view__block + .ai-prompt-view__block {
  margin-top: 0.5rem;
}

.ai-prompt-view__block > summary {
  display: flex;
  align-items: baseline;
  gap: 0.5rem;
  flex-wrap: wrap;
  padding: 0.5rem 0.75rem;
  cursor: pointer;
  list-style: none;
}

.ai-prompt-view__block > summary::-webkit-details-marker {
  display: none;
}

/* 折叠指示器：用字符而非 svg，避免为一处细节引入图标依赖。 */
.ai-prompt-view__block > summary::before {
  content: '▸';
  flex: 0 0 auto;
  color: var(--text-muted);
  font-size: 0.7rem;
  transition: transform var(--admin-table-row-interaction);
}

.ai-prompt-view__block[open] > summary::before {
  transform: rotate(90deg);
}

.ai-prompt-view__block > summary:hover {
  background: var(--bg-hover);
  border-radius: var(--radius-sm);
}

.ai-prompt-view__block > summary:focus-visible {
  outline: 2px solid var(--color-primary);
  outline-offset: -2px;
  border-radius: var(--radius-sm);
}

.ai-prompt-view__block-title {
  color: var(--text-primary);
  font-size: 0.78rem;
  font-weight: 500;
}

/* 材料类型与来源：回答「这段从哪来」，弱化到辅助信息层级。 */
.ai-prompt-view__block-kind,
.ai-prompt-view__block-source {
  color: var(--text-muted);
  font-size: 0.7rem;
}

.ai-prompt-view__block-source {
  margin-inline-start: auto;
  font-variant-numeric: tabular-nums;
}

/* 块内正文：JSON.parse 后换行已还原为真实换行，这里只保留空白。
   不用等宽字体——正文是中文小说，等宽会让段落更难读。 */
.ai-prompt-view__block-text {
  margin: 0;
  padding: 0 0.75rem 0.75rem;
  max-height: min(50svh, 28rem);
  overflow: auto;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  color: var(--text-secondary);
  font-family: inherit;
  font-size: 0.78rem;
  line-height: 1.7;
}

/* 段落外的尾部文本（如「输出要求：…」），不属于任何材料块。 */
.ai-prompt-view__note {
  margin: 1rem 0 0;
  padding: 0.5rem 0.75rem;
  border-radius: var(--radius-sm);
  background: var(--bg-secondary);
  color: var(--text-secondary);
  font-size: 0.78rem;
  line-height: 1.7;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

/* 原始文本视图：保持等宽与逐字对齐，供核对使用。 */
.ai-prompt-view__raw {
  margin: 0;
  padding: 1rem 1.25rem;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--bg-secondary);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  color: var(--text-muted);
  font-size: 0.72rem;
  line-height: 1.7;
}

@media (min-width: 1100px) {
  .ai-config-providers {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    position: relative;
    gap: 3rem;
  }

  .ai-config-providers::after {
    position: absolute;
    top: 0.25rem;
    bottom: 0.25rem;
    left: 50%;
    width: 1px;
    background: var(--border);
    content: '';
    pointer-events: none;
  }

  .ai-config-providers .ai-provider-section .ai-form-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .ai-config-secondary {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    align-items: stretch;
    gap: 0.75rem;
  }

  .ai-config-secondary > .ai-config-card {
    display: flex;
    flex: 1;
    flex-direction: column;
  }

  .ai-config-secondary > .ai-config-card > [data-slot='card-content'] {
    flex: 1;
  }
}

*{box-sizing:border-box} body{margin:0;padding:24px;background:var(--bg-secondary);font-family:system-ui,sans-serif;color:var(--text-primary)}main{max-width:1000px;margin:auto;background:var(--bg-card);border-radius:20px;padding:24px}button{font:inherit;cursor:pointer} h1{font-size:16px;margin:0 0 8px}p{font-size:12px;color:var(--text-muted);margin:0 0 20px}</style><main class="ai-service"><h1>推荐情节</h1><p>局部样式验收 · 示例内容，使用项目当前候选区样式</p><div class="ai-writing-brief-layout__aside"><div class="ai-writing-suggest"><button class="ai-writing-suggest__item" aria-pressed="false"><span class="ai-writing-suggest__index">1</span><span class="ai-writing-suggest__body"><span class="ai-writing-suggest__direction">旧邮局里的第二封信让两条时间线逐渐交汇。她先核对邮戳，再从档案中寻找寄信人的线索，暂时保留自己的猜想。</span><span class="ai-writing-suggest__effect"><span aria-hidden="true">→</span><span>用新线索推进悬念，同时保留下一章的揭晓空间。</span></span></span></button><button class="ai-writing-suggest__item" aria-pressed="false"><span class="ai-writing-suggest__index">2</span><span class="ai-writing-suggest__body"><span class="ai-writing-suggest__direction">夜间的车站停电，两位同行者只能在候车室等待。他们回忆起不同版本的旧事，发现彼此一直遗漏了关键细节。</span><span class="ai-writing-suggest__effect"><span aria-hidden="true">→</span><span>通过对话展现人物关系，让矛盾自然浮出。</span></span></span></button><button class="ai-writing-suggest__item" aria-pressed="false"><span class="ai-writing-suggest__index">3</span><span class="ai-writing-suggest__body"><span class="ai-writing-suggest__direction">修复老宅时，一段藏在墙后的录音被发现。众人决定先完整听完，再寻找当年的目击者。</span><span class="ai-writing-suggest__effect"><span aria-hidden="true">→</span><span>延续调查线，增加可供后续验证的证据。</span></span></span></button><button class="ai-writing-suggest__item" aria-pressed="false"><span class="ai-writing-suggest__index">4</span><span class="ai-writing-suggest__body"><span class="ai-writing-suggest__direction">主角回到曾经工作的书店，发现一份未完成的借阅记录。店员记得书名，却不愿透露借书人的名字。</span><span class="ai-writing-suggest__effect"><span aria-hidden="true">→</span><span>保留人物动机的疑问，为下一次会面铺垫。</span></span></span></button><button class="ai-writing-suggest__item" aria-pressed="false"><span class="ai-writing-suggest__index">5</span><span class="ai-writing-suggest__body"><span class="ai-writing-suggest__direction">小队在雨后重新出发。每个人对目的地都有不同期待，一次临时绕路让他们不得不重新讨论共同的计划。</span><span class="ai-writing-suggest__effect"><span aria-hidden="true">→</span><span>放缓节奏，展示团队内部的信任变化。</span></span></span></button></div></div></main></html>
