<!doctype html>
<html lang="zh-CN">
  <head>
    <script>
      // 首帧主题防 FOUC：先于 CSS 设置 data-theme。
      // 支持三态：localStorage 'light' | 'dark' | 'system'（缺省/非法值视为跟随系统）。
      ;(function () {
        var t
        try { t = localStorage.getItem('theme') } catch (e) {}
        if (t !== 'light' && t !== 'dark' && t !== 'system') t = 'system'
        var theme = t === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : t
        document.documentElement.setAttribute('data-theme', theme)
        document.documentElement.style.colorScheme = theme

        // 调色盘：自定义强调色（localStorage 'accent'：#RRGGBB），首帧写入防 FOUC。
        // 判定逻辑与 web/src/lib/color.ts 保持一致（白字对比度 ≥4.5:1 的门限 L≈0.1833）。
        var a
        try { a = localStorage.getItem('accent') } catch (e) {}
        if (a && /^#[0-9a-fA-F]{6}$/.test(a)) {
          function lum(hex) {
            var n = parseInt(hex.slice(1), 16)
            var f = function (c) {
              c = c / 255
              return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4)
            }
            return 0.2126 * f(n >> 16 & 255) + 0.7152 * f(n >> 8 & 255) + 0.0722 * f(n & 255)
          }
          function ink(hex) { return lum(hex) > 0.1833 ? '#1D1510' : '#FFFFFF' }
          function mixW(hex) {
            var n = parseInt(hex.slice(1), 16)
            var m = function (c) { return Math.round(c + (255 - c) * 0.22) }
            var h = function (x) { return x.toString(16).padStart(2, '0') }
            return '#' + h(m(n >> 16 & 255)) + h(m(n >> 8 & 255)) + h(m(n & 255))
          }
          var root = document.documentElement
          root.setAttribute('data-accent', '')
          root.style.setProperty('--accent-base', a)
          root.style.setProperty('--accent-ink-light', ink(a))
          root.style.setProperty('--accent-ink-dark', ink(mixW(a)))
        }
      })()
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="知舟 — 发现精彩小说，享受阅读之美" />
    <title>知舟 — 小说阅读</title>
    <link rel="icon" type="image/png" href="/images/logo.png" />
    <!-- 阅读器衬线字体：Noto Serif SC（设计系统 --font-serif 首选）。只拉 400/700/900 三档，
         覆盖正文、标题与 850 级粗字重；display=swap 让首帧不阻塞渲染。 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
