<!doctype html>
<html lang="zh-CN">
  <head>
    <script>
      // 首帧主题防 FOUC：先于 CSS 设置 data-theme。
      // 支持三态：localStorage 'light' | 'dark' | 'system'（缺省/非法值视为跟随系统）。
      ;(function () {
        var t
        try { t = localStorage.getItem('theme') } catch (e) {}
        if (t !== 'light' && t !== 'dark' && t !== 'system') t = 'system'
        var theme = t === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : t
        document.documentElement.setAttribute('data-theme', theme)
        document.documentElement.style.colorScheme = theme
      })()
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="知舟 — 发现精彩小说，享受阅读之美" />
    <title>知舟 — 小说阅读</title>
    <link rel="icon" type="image/png" href="/images/logo.png" />
    <!-- 阅读器衬线字体：Noto Serif SC（设计系统 --font-serif 首选）。只拉 400/700/900 三档，
         覆盖正文、标题与 850 级粗字重；display=swap 让首帧不阻塞渲染。 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
